openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: worker
    description: Background worker operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /worker/healthz:
    get:
      operationId: workerHealthCheck
      tags: [worker]
      summary: Background worker health check
      description: Returns worker lease, heartbeat, and queue health
      responses:
        "200":
          description: Worker health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerHealth"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WorkerHealth:
      type: object
      properties:
        active:
          type: boolean
        ownerId:
          type: [string, "null"]
        heartbeatAt:
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        queuedJobs:
          type: number
        runningJobs:
          type: number
        failedJobs:
          type: number
      required:
        - active
        - ownerId
        - heartbeatAt
        - expiresAt
        - queuedJobs
        - runningJobs
        - failedJobs

